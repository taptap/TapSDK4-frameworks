name: Release iOS SDK

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: get_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Release ${{ steps.get_version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-cocoapods:
    name: Publish to CocoaPods
    needs: create-release
    runs-on: macos-15-xlarge

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Configure CocoaPods Trunk authentication
        env:
          NETRC_CONTENT: ${{ secrets.NETRC_CONTENT }}
        run: |
          if [ -z "$NETRC_CONTENT" ]; then
            echo "❌ Error: NETRC_CONTENT is not set"
            exit 1
          fi
          echo "$NETRC_CONTENT" > ~/.netrc
          chmod 600 ~/.netrc

      - name: Validate podspec version
        run: |
          PODSPEC_VERSION=$(grep -E "^\s+s\.version\s*=" iOS/PodSpecs/TapTapSDK.podspec | grep -oE "'[^']+'" | tr -d "'")
          TAG_VERSION="${{ steps.get_version.outputs.version }}"
          if [ "$PODSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch: podspec=${PODSPEC_VERSION}, tag=${TAG_VERSION}"
            exit 1
          fi
          echo "✅ Version check passed: ${TAG_VERSION}"

      - name: Lint podspec
        run: |
          pod spec lint iOS/PodSpecs/TapTapSDK.podspec \
            --allow-warnings \
            --verbose \
            --skip-import-validation

      - name: Push to CocoaPods Trunk
        run: |
          pod trunk push iOS/PodSpecs/TapTapSDK.podspec \
            --allow-warnings \
            --verbose

      - name: Release completed
        run: echo "✅ TapTapSDK ${{ steps.get_version.outputs.version }} published to CocoaPods"
